name: 🧪 CI
on:
  pull_request:
    branches:
      - master
env:
  NODE_ENV: 'test'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install
      - run: pnpm run lint
      - run: pnpm run test